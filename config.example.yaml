# All settings and credentials live here. The wizard saves this file with mode 0600.
# Categories and API keys are shared by all accounts.
jev:
  provider: auto # auto | typesafe | openrouter
  typesafe_api_key: ""
  openrouter_api_key: "" # fill in one API key
  default_threshold: 0.6

accounts:
  personal:
    host: imap.example.com
    port: 993
    username: me@example.com
    password: "your-password"
    folder: INBOX
    poll_interval_seconds: 60
    max_emails_per_run: 25
  work:
    host: imap.work.example.com
    username: me@work.example.com
    password: "your-work-password"
    folder: INBOX

categories:
  invoice:
    description: "Invoice, billing statement, or payment request"
    actions:
      - type: tag
        value: Invoice
      - type: move
        folder: Invoices

  urgent:
    description: "Time-sensitive, needs action today"
    threshold: 0.7 # overrides jev.default_threshold for this category
    actions:
      - type: tag
        value: Urgent

  spam:
    description: "Spam, phishing, or an unsolicited sales pitch"
    actions:
      - type: move
        folder: Spam
